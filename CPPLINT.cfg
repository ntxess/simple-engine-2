# cpplint (Google's linter) for new code; see docs/style.md.
# Per-module include/ directories carry their own CPPLINT.cfg setting the
# header-guard root, so engine/se_core/include/se_core/assert.h is guarded by
# SE_CORE_ASSERT_H_.
set noparent
linelength=80
# clang-format owns whitespace and include grouping inside blocks.
filter=-whitespace/indent_namespace,-build/include_order
